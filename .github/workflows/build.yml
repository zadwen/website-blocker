name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and build executable
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: WebsiteBlocker-Windows
          path: dist/WebsiteBlocker.exe
          if-no-files-found: error
          retention-days: 30
